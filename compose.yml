
# helpful reference: https://github.com/docker/awesome-compose/blob/master/nginx-golang-postgres/compose.yaml

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    container_name: widgetcorp-postgres
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgetdb
    # expose:
    #   - 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widgetdb"]
      interval: 2s
      timeout: 5s
      retries: 5

  widget-srv:
    build:
      context: ./widget-srv
    container_name: widgetcorp-widget-srv
    restart: unless-stopped
    depends_on:
      postgres:
        # Wait for postgres to pass its healthcheck before starting, so our
        # startup migrations don't race the DB coming up.
        condition: service_healthy
    environment:
      # Host is the compose service name "postgres" (resolved over the compose
      # network), NOT localhost — from inside the container localhost is itself.
      DATABASE_URL: postgres://widget:widget@postgres:5432/widgetdb?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
